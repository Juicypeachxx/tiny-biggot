[preset.0]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.tbatlas"
exclude_filter="tests/*, tools/*, reference/*, *.md"
export_path="../ios_export/TinyBiggot.xcodeproj"

[preset.0.options]

application/app_store_team_id="ABCDE12345"
application/bundle_identifier="com.joze.tinybiggot"
application/short_version="1.0"
application/version="1"
application/export_project_only=true
application/export_method_release=1
application/code_sign_identity_debug="Apple Development"
application/code_sign_identity_release="Apple Development"
application/additional_plist_content="<key>LSSupportsGameMode</key>
<true/>
<key>GCSupportsGameMode</key>
<true/>
<key>LSApplicationCategoryType</key>
<string>public.app-category.games</string>"
application/targeted_device_family=2
application/icon_interpolation=0
icons/icon_1024x1024="res://ios_icon_1024.png"
architectures/arm64=true
storyboard/custom_image@2x="res://assets/launch_blank.png"
storyboard/custom_image@3x="res://assets/launch_blank.png"
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0, 0, 0, 1)

